# blast-radius-bench — add anthropic/claude-fable-5.1 to the leaderboard (Docker).
# Same conditions as the frozen leaderboard run: 1800s agent timeout, graded capture.
jobs_dir: jobs
n_attempts: 3
n_concurrent_trials: 4   # claude-fable-5 rate-limited at 8 concurrent on OpenRouter; 4 with an early probe, 2 on 429s
quiet: false

environment:
  type: docker

agents:
  - name: terminus-2
    model_name: openrouter/anthropic/claude-fable-5.1
    override_timeout_sec: 1800

datasets:
  - path: datasets/blastradiusbench
    task_names:
      - backend-connectivity-cascade
      - cdn-origin-overload
      - disk-pressure-noisy-neighbor
      - dual-independent-incidents
      - fan-in-quiet-downstream
      - fdb-tso-flink-cascade
      - grpc-deadline-chain
      - memory-pressure-eviction-cascade
      - mid-chain-cache-origin
      - noisy-neighbor-node
      - retry-storm-amplification
      - shared-dns-resolver-degradation
      - shared-dynamodb-throttle
      - shared-kafka-saturation
      - shared-nat-egress-saturation
      - shared-postgres-saturation
      - shared-redis-eviction
